site_name: "Commercial Refrigeration & HVAC Compliance Reference"
site_url: https://clean-hvac-reference.readthedocs.io/
site_description: "Commercial Refrigeration & HVAC Compliance Reference: compiled from public-domain US federal government publications."
site_author: "Clean HVAC Services Archive"
copyright: "Compiled from public-domain US federal government publications."

docs_dir: docs

theme:
  name: material
  features:
    - navigation.top
  palette:
    - scheme: default
      primary: indigo

nav:
  - Reference: index.md

markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3

extra:
  generator: false
